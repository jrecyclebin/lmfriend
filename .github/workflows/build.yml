name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, exe: lmfriend }
          - { os: windows-latest, rid: win-x64,   exe: lmfriend.exe }
          - { os: macos-latest,   rid: osx-x64,   exe: lmfriend }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained AOT binary
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained

      - name: Zip the binary (unix)
        if: runner.os != 'Windows'
        run: zip -j bin/lmfriend-${{ matrix.rid }}.zip bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.exe }}

      - name: Zip the binary (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.exe }} `
            -DestinationPath bin/lmfriend-${{ matrix.rid }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: lmfriend-${{ matrix.rid }}
          path: bin/lmfriend-${{ matrix.rid }}.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet publish -c Release -r linux-x64 --self-contained
      - run: python3 tests/reconnect_test.py
